<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickInvoice — Invoice &amp; Receipt Generator</title>
    <meta
      name="description"
      content="Create, customize, preview, print, and export professional invoices and receipts to PDF right in your browser."
    />
    <meta property="og:title" content="QuickInvoice — Invoice &amp; Receipt Generator" />
    <meta
      property="og:description"
      content="Create, customize, preview, print, and export professional invoices and receipts to PDF right in your browser."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: Plus Jakarta Sans (Display), DM Sans (Body), IBM Plex Mono (Tabular Numerals) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent flash of incorrect theme on initial load -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('quickinvoice_theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          // Ignore storage errors
        }
      })();
    </script>

    <!--
      Self-contained pure-hex CSS for printable/PDF Invoice & Receipt templates.
      Keeping these styles free of Tailwind v4 oklch() color functions ensures
      html2pdf.js / html2canvas renders crisp, accurate PDFs across all browsers.
    -->
    <style id="pdf-paper-styles">
      .qi-paper {
        background-color: #ffffff;
        color: #0f172a;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        line-height: 1.5;
        box-sizing: border-box;
        width: 100%;
        position: relative;
      }
      .qi-paper *,
      .qi-paper *::before,
      .qi-paper *::after {
        box-sizing: border-box;
      }
      .qi-mono {
        font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-variant-numeric: tabular-nums;
      }
      .qi-display {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .qi-tabular {
        font-variant-numeric: tabular-nums;
      }

      /* Classic Template */
      .qi-classic {
        padding: 44px 48px;
        border-top: 6px solid #0f172a;
      }
      .qi-classic-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 24px;
        padding-bottom: 28px;
        border-bottom: 1px solid #cbd5e1;
      }
      .qi-classic-title {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #0f172a;
        margin: 0 0 8px 0;
        text-transform: uppercase;
      }
      .qi-classic-meta-table {
        margin-left: auto;
        border-collapse: collapse;
        font-size: 13px;
      }
      .qi-classic-meta-table td {
        padding: 3px 0;
      }
      .qi-classic-meta-label {
        color: #64748b;
        padding-right: 16px;
        text-align: left;
      }
      .qi-classic-meta-val {
        color: #0f172a;
        font-weight: 600;
        text-align: right;
      }

      /* Modern Template */
      .qi-modern {
        padding: 0;
        overflow: hidden;
      }
      .qi-modern-banner {
        background-color: #1d4ed8;
        color: #ffffff;
        padding: 36px 44px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 24px;
      }
      .qi-modern-banner-receipt {
        background-color: #0f172a;
      }
      .qi-modern-body {
        padding: 36px 44px 44px 44px;
      }
      .qi-modern-doc-title {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #ffffff;
        margin: 0 0 4px 0;
        text-transform: uppercase;
      }
      .qi-modern-sub {
        color: #dbeafe;
        font-size: 13px;
        margin: 0;
      }
      .qi-modern-meta-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        background-color: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 16px 20px;
        margin-bottom: 28px;
      }
      .qi-modern-meta-item-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #64748b;
        margin: 0 0 4px 0;
      }
      .qi-modern-meta-item-val {
        font-size: 13px;
        font-weight: 600;
        color: #0f172a;
        margin: 0;
      }

      /* Shared Paper Blocks */
      .qi-logo-box {
        max-height: 56px;
        max-width: 160px;
        object-fit: contain;
        display: block;
        margin-bottom: 10px;
      }
      .qi-logo-box-modern {
        background-color: #ffffff;
        padding: 6px 10px;
        border-radius: 6px;
        max-height: 54px;
        max-width: 150px;
        object-fit: contain;
        display: block;
        margin-bottom: 12px;
      }
      .qi-parties-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 32px;
        margin-top: 24px;
        margin-bottom: 28px;
      }
      .qi-party-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #64748b;
        margin: 0 0 6px 0;
      }
      .qi-party-name {
        font-size: 16px;
        font-weight: 700;
        color: #0f172a;
        margin: 0 0 4px 0;
      }
      .qi-party-line {
        font-size: 13px;
        color: #475569;
        margin: 2px 0;
        word-break: break-word;
      }

      /* Paper Items Table */
      .qi-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 28px;
      }
      .qi-classic .qi-table th {
        background-color: #f1f5f9;
        color: #0f172a;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 10px 12px;
        border-top: 1px solid #cbd5e1;
        border-bottom: 1px solid #cbd5e1;
      }
      .qi-classic .qi-table td {
        padding: 12px;
        font-size: 13px;
        color: #1e293b;
        border-bottom: 1px solid #e2e8f0;
        vertical-align: top;
      }
      .qi-modern .qi-table th {
        background-color: #eff6ff;
        color: #1e40af;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 11px 14px;
        border-bottom: 2px solid #bfdbfe;
      }
      .qi-modern .qi-table td {
        padding: 13px 14px;
        font-size: 13px;
        color: #1e293b;
        border-bottom: 1px solid #f1f5f9;
        vertical-align: top;
      }
      .qi-modern .qi-table tbody tr:nth-child(even) {
        background-color: #f8fafc;
      }
      .qi-text-left {
        text-align: left;
      }
      .qi-text-right {
        text-align: right;
      }
      .qi-text-center {
        text-align: center;
      }

      /* Totals Block */
      .qi-bottom-grid {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 32px;
      }
      .qi-notes-col {
        flex: 1 1 55%;
      }
      .qi-totals-col {
        flex: 0 0 280px;
        margin-left: auto;
      }
      .qi-totals-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        font-size: 13px;
        color: #475569;
      }
      .qi-totals-row-strong {
        font-weight: 600;
        color: #0f172a;
      }
      .qi-grand-total-classic {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        padding: 12px 0 4px 0;
        border-top: 2px solid #0f172a;
        font-size: 17px;
        font-weight: 800;
        color: #0f172a;
      }
      .qi-grand-total-modern {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        padding: 14px 16px;
        background-color: #1d4ed8;
        color: #ffffff;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 700;
      }
      .qi-notes-title {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #64748b;
        margin: 0 0 6px 0;
      }
      .qi-notes-text {
        font-size: 12.5px;
        color: #475569;
        white-space: pre-wrap;
        margin: 0;
      }

      /* Paid / Receipt Stamp */
      .qi-status-stamp {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .qi-stamp-paid {
        background-color: #dcfce7;
        color: #15803d;
        border: 1px solid #86efac;
      }
      .qi-stamp-pending {
        background-color: #fef3c7;
        color: #b45309;
        border: 1px solid #fcd34d;
      }
      .qi-stamp-receipt {
        background-color: #dbeafe;
        color: #1d4ed8;
        border: 1px solid #93c5fd;
      }
      .qi-paper-footer {
        margin-top: 36px;
        padding-top: 16px;
        border-top: 1px solid #e2e8f0;
        font-size: 12px;
        color: #64748b;
        text-align: center;
      }

      @media (max-width: 640px) {
        .qi-classic {
          padding: 24px 20px;
        }
        .qi-modern-banner {
          padding: 24px 20px;
          flex-direction: column;
        }
        .qi-modern-body {
          padding: 24px 20px;
        }
        .qi-classic-header {
          flex-direction: column;
        }
        .qi-classic-meta-table {
          margin-left: 0;
        }
        .qi-modern-meta-strip {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .qi-parties-grid {
          grid-template-columns: 1fr;
          gap: 20px;
        }
        .qi-bottom-grid {
          flex-direction: column;
        }
        .qi-totals-col {
          width: 100%;
          flex: none;
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
